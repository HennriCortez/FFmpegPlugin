name: Build FFmpeg Plugin APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      NDK_VERSION_STR: "21.4.7075529"
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm autogen automake autoconf \
            libtool pkg-config curl unzip zip git cmake ninja-build gperf ccache

      # ---------------------------------------------------------------------
      # ccache speeds up re-compiles when build-ffmpeg-android.sh only changes
      # slightly; Ubuntu's ccache package symlinks common compiler names, so
      # putting it first on PATH intercepts clang/clang++ transparently with
      # no changes needed inside build-ffmpeg-android.sh itself.
      # ---------------------------------------------------------------------
      - name: Enable ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-ffmpeg-${{ hashFiles('build-ffmpeg-android.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-ffmpeg-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------------------
      # Cache the NDK install itself — sdkmanager re-downloads a ~1GB archive
      # from Google every run otherwise.
      # ---------------------------------------------------------------------
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION_STR }}
          key: ndk-${{ env.NDK_VERSION_STR }}

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION_STR }}"

      - name: Point env at the NDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.NDK_VERSION_STR }}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Biggest win: skip the whole ffmpeg cross-compile outright when the
      # build script and toolchain versions haven't changed since last run.
      # ---------------------------------------------------------------------
      - name: Cache ffmpeg build output
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            out/libffmpeg.so
            build
          key: ffmpeg-build-${{ runner.os }}-${{ hashFiles('build-ffmpeg-android.sh') }}-${{ env.NDK_VERSION_STR }}-api24-ossl1.1.1w

      - name: Cross-compile standalone ffmpeg (arm64, HTTPS)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          chmod +x build-ffmpeg-android.sh
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION_STR }}" NDK_VERSION=r21e API_LEVEL=24 FFMPEG_VERSION=9.0.1 ./build-ffmpeg-android.sh

      - name: Verify MediaCodec support
        run: |
          set -euo pipefail
          test -s out/libffmpeg.so
          strings out/libffmpeg.so | grep -i mediacodec

      # -----------------------------------------------------------------------
      # Build libaaudio_sink.so using the same NDK that's already installed.
      # AAudio requires API 26+; the .so is a thin wrapper dlopen-ed at runtime.
      # -----------------------------------------------------------------------
      - name: Build libaaudio_sink.so (arm64)
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/${{ env.NDK_VERSION_STR }}/toolchains/llvm/prebuilt/linux-x86_64"
          API_LEVEL=26
          CXX="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++"
          STRIP="$TOOLCHAIN/bin/llvm-strip"
          SYSROOT="$TOOLCHAIN/sysroot"

          chmod +x "$GITHUB_WORKSPACE/build-aaudio-android.sh"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION_STR }}" \
            NDK_VERSION=r21e API_LEVEL=26 "$GITHUB_WORKSPACE/build-aaudio-android.sh"
          exit 0

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/cpp"
          cd "$GITHUB_WORKSPACE/app/src/main/cpp"
          if [ ! -d "oboe" ]; then
            git clone --depth 1 https://github.com/google/oboe.git oboe
          fi

            cat > jni_bridge.cpp << 'EOF'
            #include <oboe/Oboe.h>
            #include <atomic>
            #include <cstdint>
            #include <cstring>
            #include <memory>
            #include <mutex>
            #include <vector>

            class AudioPlayerEngine : public oboe::AudioStreamDataCallback {
            public:
              std::shared_ptr<oboe::AudioStream> stream;
              std::vector<uint8_t> ringBuffer;
              size_t ringWritePos = 0;
              size_t ringReadPos = 0;
              std::mutex lock;
              std::atomic<bool> isClosing{false};
              std::atomic<int64_t> totalFramesWritten{0};

              bool open(int32_t sampleRate, int32_t channelCount) {
                oboe::AudioStreamBuilder builder;
                builder.setDirection(oboe::Direction::Output);
                builder.setPerformanceMode(oboe::PerformanceMode::LowLatency);
                builder.setSharingMode(oboe::SharingMode::Shared);
                builder.setFormat(oboe::AudioFormat::I16);
                builder.setSampleRate(sampleRate);
                builder.setChannelCount(channelCount);
                builder.setDataCallback(this);
                ringBuffer.resize(static_cast<size_t>(sampleRate) * channelCount * sizeof(int16_t) * 4);
                if (builder.openStream(stream) != oboe::Result::OK) return false;
                return stream->requestStart() == oboe::Result::OK;
              }

              oboe::DataCallbackResult onAudioReady(
                oboe::AudioStream*, void* audioData, int32_t numFrames) override {
                if (isClosing.load()) return oboe::DataCallbackResult::Stop;
                std::lock_guard<std::mutex> guard(lock);
                auto* output = static_cast<uint8_t*>(audioData);
                const size_t bytes = static_cast<size_t>(numFrames) * 4;
                for (size_t i = 0; i < bytes; ++i) {
                  if (ringReadPos == ringWritePos) output[i] = 0;
                  else {
                    output[i] = ringBuffer[ringReadPos];
                    ringReadPos = (ringReadPos + 1) % ringBuffer.size();
                  }
                }
                return oboe::DataCallbackResult::Continue;
              }

              int32_t writeData(const uint8_t* data, int32_t frames) {
                if (!data || frames <= 0) return 0;
                std::lock_guard<std::mutex> guard(lock);
                const size_t requested = static_cast<size_t>(frames) * 4;
                size_t written = 0;
                while (written < requested) {
                  const size_t next = (ringWritePos + 1) % ringBuffer.size();
                  if (next == ringReadPos) break;
                  ringBuffer[ringWritePos] = data[written++];
                  ringWritePos = next;
                }
                const int32_t accepted = static_cast<int32_t>(written / 4);
                totalFramesWritten.fetch_add(accepted);
                return accepted;
              }

              void close() {
                isClosing.store(true);
                if (stream) {
                  stream->requestStop();
                  stream->close();
                  stream.reset();
                }
              }

              void flush() {
                std::lock_guard<std::mutex> guard(lock);
                ringReadPos = ringWritePos = 0;
              }
            };

            extern "C" {
              void* aaudio_open(int32_t sampleRate, int32_t channelCount) {
                auto* engine = new AudioPlayerEngine();
                if (engine->open(sampleRate, channelCount)) return engine;
                delete engine;
                return nullptr;
              }
              void aaudio_close(void* handle) {
                if (!handle) return;
                auto* engine = static_cast<AudioPlayerEngine*>(handle);
                engine->close();
                delete engine;
              }
              int32_t aaudio_write(void* handle, const void* data, int32_t frames, int64_t) {
                return handle ? static_cast<AudioPlayerEngine*>(handle)->writeData(
                  static_cast<const uint8_t*>(data), frames) : -1;
              }
              int64_t aaudio_frames_written(void* handle) {
                return handle ? static_cast<AudioPlayerEngine*>(handle)->totalFramesWritten.load() : -1;
              }
              int32_t aaudio_pause(void* handle) {
                return handle && static_cast<AudioPlayerEngine*>(handle)->stream
                  ? static_cast<AudioPlayerEngine*>(handle)->stream->requestPause() == oboe::Result::OK ? 0 : -1 : -1;
              }
              int32_t aaudio_resume(void* handle) {
                return handle && static_cast<AudioPlayerEngine*>(handle)->stream
                  ? static_cast<AudioPlayerEngine*>(handle)->stream->requestStart() == oboe::Result::OK ? 0 : -1 : -1;
              }
              int32_t aaudio_flush(void* handle) {
                if (!handle) return -1;
                static_cast<AudioPlayerEngine*>(handle)->flush();
                return 0;
              }
              int32_t aaudio_buffer_size(void* handle) {
                if (!handle) return -1;
                auto stream = static_cast<AudioPlayerEngine*>(handle)->stream;
                return stream ? stream->getBufferSizeInFrames() : -1;
              }
              int32_t aaudio_get_timestamp(void*, int64_t*, int64_t*) { return -1; }
            }
            EOF

          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${{ env.NDK_VERSION_STR }}"
            rm -rf "$GITHUB_WORKSPACE/build/aaudio/cmake-build" "$GITHUB_WORKSPACE/out/libaaudio_sink.so"
          cmake -S "$GITHUB_WORKSPACE/app/src/main/cpp" -B "$GITHUB_WORKSPACE/build/aaudio/cmake-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -GNinja
          cmake --build "$GITHUB_WORKSPACE/build/aaudio/cmake-build" --target aaudio_sink --config Release --verbose

          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "=== AAudio build outputs ==="
          find "$GITHUB_WORKSPACE/build/aaudio/cmake-build" -type f -name '*.so' -print
          AAudioLib="$(find "$GITHUB_WORKSPACE/build/aaudio/cmake-build" -type f -name 'libaaudio_sink.so' -print -quit)"
          test -n "$AAudioLib"
          echo "Found AAudio library: $AAudioLib"
          cp "$AAudioLib" "$GITHUB_WORKSPACE/out/libaaudio_sink.so"
          TOOLCHAIN="$ANDROID_HOME/ndk/${{ env.NDK_VERSION_STR }}/toolchains/llvm/prebuilt/linux-x86_64"
          "$TOOLCHAIN/bin/llvm-strip" "$GITHUB_WORKSPACE/out/libaaudio_sink.so"

      - name: Install binaries into jniLibs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          test -s "$GITHUB_WORKSPACE/out/libffmpeg.so"
          AAudioLib="$(find "$GITHUB_WORKSPACE" -type f -name 'libaaudio_sink.so' -print -quit)"
          test -n "$AAudioLib"
          test -s "$AAudioLib"
          echo "Installing AAudio library: $AAudioLib"
          cp "$GITHUB_WORKSPACE/out/libffmpeg.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libffmpeg.so"
          cp "$AAudioLib" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libaaudio_sink.so"
          curl --fail --location --retry 3 \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64" \
            --output "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libytdlp.so"
          chmod +x "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libytdlp.so"
          echo "=== jniLibs contents ===" && find "$GITHUB_WORKSPACE/app/src/main/jniLibs" -type f

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK (no signing secrets needed)
        run: ./gradlew assembleDebug

      - name: Assemble + sign release APK (only if secrets are set)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-plugin-apk
          path: app/build/outputs/apk/debug/*.apk
