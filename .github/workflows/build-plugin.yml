# Place this at: .github/workflows/build-plugin.yml
#
# Builds the FFmpeg plugin APK using the project's own official build
# pipeline (scripts/setup_environ.sh + scripts/build_libs.sh via ffmpeg-kit),
# run on GitHub's Linux runner since the project only builds on Linux.
#
# Required repo secrets for signing (optional — skip if sideloading debug):
#   KEYSTORE_BASE64      - base64 of your .jks/.keystore file
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD

name: Build FFmpeg Plugin APK
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm autogen automake autoconf \
            libtool pkg-config curl unzip zip git cmake ninja-build gperf

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
            sdkmanager --install "ndk;21.4.7075529"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Cross-compile standalone ffmpeg (arm64, HTTPS)
        run: |
          chmod +x build-ffmpeg-android.sh
          NDK_VERSION=r27c API_LEVEL=24 ./build-ffmpeg-android.sh

      - name: Install ffmpeg and yt-dlp into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp out/libffmpeg.so app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64" \
            -o app/src/main/jniLibs/arm64-v8a/libytdlp.so
          echo "=== jniLibs contents ==="
          find app/src/main/jniLibs/ -type f

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK (no signing secrets needed)
        run: ./gradlew assembleDebug

      - name: Assemble + sign release APK (only if secrets are set)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-plugin-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
