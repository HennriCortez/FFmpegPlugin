# Place this at: .github/workflows/build-plugin.yml
# in your fork of https://github.com/PojavLauncherTeam/FFmpegPlugin
#
# It builds a standalone, HTTPS-capable ffmpeg for arm64, renames it to
# libffmpeg.so, drops it into jniLibs, then assembles + signs the plugin APK.
#
# Required repo secrets for signing (skip signing step if you'll sideload
# a debug build instead — see the "Assemble debug APK" step below):
#   KEYSTORE_BASE64      - base64 of your .jks/.keystore file
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD

name: Build FFmpeg Plugin APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip pkg-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cross-compile standalone ffmpeg (arm64, HTTPS)
        run: |
          chmod +x build-ffmpeg-android.sh
          NDK_VERSION=r27c API_LEVEL=24 ./build-ffmpeg-android.sh

      - name: Install ffmpeg binary as libffmpeg.so
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp out/libffmpeg.so app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          file app/src/main/jniLibs/arm64-v8a/libffmpeg.so

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK (no signing secrets needed)
        run: ./gradlew assembleDebug

      - name: Assemble + sign release APK (only if secrets are set)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-plugin-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
