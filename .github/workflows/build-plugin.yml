# Place this at: .github/workflows/build-plugin.yml
#
# Builds the FFmpeg plugin APK using the project's own official build
# pipeline (scripts/setup_environ.sh + scripts/build_libs.sh via ffmpeg-kit),
# run on GitHub's Linux runner since the project only builds on Linux.
#
# Required repo secrets for signing (optional — skip if sideloading debug):
#   KEYSTORE_BASE64      - base64 of your .jks/.keystore file
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
name: Build FFmpeg Plugin APK
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm autogen automake autoconf \
            libtool pkg-config curl unzip zip git cmake ninja-build gperf
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
      - name: Cross-compile standalone ffmpeg (arm64, HTTPS)
        run: |
          chmod +x build-ffmpeg-android.sh
          unset ANDROID_NDK_HOME
          NDK_VERSION=r27c API_LEVEL=24 OPENSSL_VERSION=1.1.1w ./build-ffmpeg-android.sh

      # -----------------------------------------------------------------------
      # NEW: Build libaaudio_sink.so using the same NDK that's already installed
      # AAudio requires API 26+; the .so is a thin wrapper dlopen-ed at runtime
      # -----------------------------------------------------------------------
      - name: Build libaaudio_sink.so (arm64)
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64"
          API_LEVEL=26
          CXX="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++"
          STRIP="$TOOLCHAIN/bin/llvm-strip"
          SYSROOT="$TOOLCHAIN/sysroot"

          mkdir -p build/aaudio

          cat > build/aaudio/aaudio_sink.cpp << 'EOF'
          #include <aaudio/AAudio.h>
          #include <android/log.h>
          #include <cstdint>
          #include <time.h>

          #define TAG "AAudioSink"
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          extern "C" {

          void* aaudio_open(int32_t sampleRate, int32_t channelCount) {
              AAudioStreamBuilder* builder = nullptr;
              if (AAudio_createStreamBuilder(&builder) != AAUDIO_OK) return nullptr;
              AAudioStreamBuilder_setSampleRate(builder, sampleRate);
              AAudioStreamBuilder_setChannelCount(builder, channelCount);
              AAudioStreamBuilder_setFormat(builder, AAUDIO_FORMAT_PCM_I16);
              AAudioStreamBuilder_setPerformanceMode(builder, AAUDIO_PERFORMANCE_MODE_LOW_LATENCY);
              AAudioStreamBuilder_setSharingMode(builder, AAUDIO_SHARING_MODE_EXCLUSIVE);
              AAudioStream* stream = nullptr;
              aaudio_result_t r = AAudioStreamBuilder_openStream(builder, &stream);
              AAudioStreamBuilder_delete(builder);
              if (r != AAUDIO_OK) {
                  LOGE("aaudio_open failed: %s", AAudio_convertResultToText(r));
                  return nullptr;
              }
              AAudioStream_requestStart(stream);
              return stream;
          }

          void aaudio_close(void* handle) {
              if (!handle) return;
              auto* h = static_cast<AAudioSinkHandle*>(handle);
              if (h->stream) {
                  AAudioStream_requestStop(h->stream);
                  aaudio_stream_state_t state = AAudioStream_getState(h->stream);
                  // Don't close until the stream has actually finished stopping — closing while it's
                  // still tearing down can double-destroy an internal mutex (FORTIFY abort).
                  AAudioStream_waitForStateChange(h->stream, state, &state, 500'000'000LL);
                  AAudioStream_close(h->stream);
              }
              delete h;
          }

          int32_t aaudio_write(void* h, const void* data, int32_t frames, int64_t timeoutNs) {
              if (!h) return -1;
              return AAudioStream_write((AAudioStream*)h, data, frames, timeoutNs);
          }

          int32_t aaudio_get_timestamp(void* h, int64_t* outPos, int64_t* outNs) {
              if (!h) return -1;
              return AAudioStream_getTimestamp((AAudioStream*)h, CLOCK_MONOTONIC, outPos, outNs);
          }

          int64_t aaudio_frames_written(void* h) {
              if (!h) return -1;
              return AAudioStream_getFramesWritten((AAudioStream*)h);
          }

          int32_t aaudio_pause(void* h)  { return h ? AAudioStream_requestPause((AAudioStream*)h)  : -1; }
          int32_t aaudio_resume(void* h) { return h ? AAudioStream_requestStart((AAudioStream*)h)  : -1; }
          int32_t aaudio_flush(void* h)  { return h ? AAudioStream_requestFlush((AAudioStream*)h)  : -1; }
          int32_t aaudio_buffer_size(void* h) { return h ? AAudioStream_getBufferSizeInFrames((AAudioStream*)h) : -1; }

          } // extern "C"
          EOF

          "$CXX" \
            --sysroot="$SYSROOT" \
            -target aarch64-linux-android${API_LEVEL} \
            -shared -fPIC \
            -O2 \
            -o build/aaudio/libaaudio_sink.so \
            build/aaudio/aaudio_sink.cpp \
            -laaudio -llog

          "$STRIP" build/aaudio/libaaudio_sink.so
          mkdir -p out
          cp build/aaudio/libaaudio_sink.so out/libaaudio_sink.so
          echo "=== libaaudio_sink.so ===" && file out/libaaudio_sink.so

      - name: Install ffmpeg, yt-dlp and aaudio_sink into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp out/libffmpeg.so         app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          cp out/libaaudio_sink.so    app/src/main/jniLibs/arm64-v8a/libaaudio_sink.so   # NEW
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64" \
            -o app/src/main/jniLibs/arm64-v8a/libytdlp.so
          echo "=== jniLibs contents ==="
          find app/src/main/jniLibs/ -type f

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew
      - name: Assemble debug APK (no signing secrets needed)
        run: ./gradlew assembleDebug
      - name: Assemble + sign release APK (only if secrets are set)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-plugin-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
