name: Build FFmpeg Plugin APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      NDK_VERSION_STR: "21.4.7075529"
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm autogen automake autoconf \
            libtool pkg-config curl unzip zip git cmake ninja-build gperf ccache

      # ---------------------------------------------------------------------
      # ccache speeds up re-compiles when build-ffmpeg-android.sh only changes
      # slightly; Ubuntu's ccache package symlinks common compiler names, so
      # putting it first on PATH intercepts clang/clang++ transparently with
      # no changes needed inside build-ffmpeg-android.sh itself.
      # ---------------------------------------------------------------------
      - name: Enable ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"

      - name: Cache ccache directory
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-ffmpeg-${{ hashFiles('build-ffmpeg-android.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-ffmpeg-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------------------
      # Cache the NDK install itself — sdkmanager re-downloads a ~1GB archive
      # from Google every run otherwise.
      # ---------------------------------------------------------------------
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION_STR }}
          key: ndk-${{ env.NDK_VERSION_STR }}

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION_STR }}"

      - name: Point env at the NDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.NDK_VERSION_STR }}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Biggest win: skip the whole ffmpeg cross-compile outright when the
      # build script and toolchain versions haven't changed since last run.
      # ---------------------------------------------------------------------
      - name: Cache ffmpeg build output
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            out/libffmpeg.so
            build
          key: ffmpeg-build-${{ runner.os }}-${{ hashFiles('build-ffmpeg-android.sh') }}-r27c-api24-ossl1.1.1w

      - name: Cross-compile standalone ffmpeg (arm64, HTTPS)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          chmod +x build-ffmpeg-android.sh
          NDK_VERSION=r27c API_LEVEL=24 ./build-ffmpeg-android.sh

      - name: Verify MediaCodec support
        run: |
          set -euo pipefail
          test -s out/libffmpeg.so
          strings out/libffmpeg.so | grep -i mediacodec

      # -----------------------------------------------------------------------
      # Build libaaudio_sink.so using the same NDK that's already installed.
      # AAudio requires API 26+; the .so is a thin wrapper dlopen-ed at runtime.
      # -----------------------------------------------------------------------
      - name: Build libaaudio_sink.so (arm64)
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/${{ env.NDK_VERSION_STR }}/toolchains/llvm/prebuilt/linux-x86_64"
          API_LEVEL=26
          CXX="$TOOLCHAIN/bin/aarch64-linux-android${API_LEVEL}-clang++"
          STRIP="$TOOLCHAIN/bin/llvm-strip"
          SYSROOT="$TOOLCHAIN/sysroot"

          mkdir -p build/aaudio
          cd build/aaudio
          if [ ! -d "oboe" ]; then
            git clone --depth 1 https://github.com/google/oboe.git oboe
          fi

          cat > aaudio_sink.cpp << 'EOF'
          #include <oboe/Oboe.h>
          #include <vector>
          #include <mutex>
          #include <atomic>
          #include <android/log.h>

          #define TAG "AAudioSink"
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, TAG, __VA_ARGS__)

          class AudioPlayerEngine : public oboe::AudioStreamDataCallback {
          public:
              std::shared_ptr<oboe::AudioStream> stream;
              std::vector<uint8_t> ringBuffer;
              size_t ringWritePos = 0;
              size_t ringReadPos = 0;
              std::mutex lock;
              std::atomic<bool> isClosing{false};
              int64_t totalFramesWritten = 0;

              bool open(int32_t sampleRate, int32_t channelCount) {
                  oboe::AudioStreamBuilder builder;
                  builder.setDirection(oboe::Direction::Output);
                  builder.setPerformanceMode(oboe::PerformanceMode::LowLatency);
                  builder.setSharingMode(oboe::SharingMode::Shared); 
                  builder.setFormat(oboe::AudioFormat::I16);
                  builder.setSampleRate(sampleRate);
                  builder.setChannelCount(channelCount);
                  builder.setDataCallback(this);
                  ringBuffer.resize(sampleRate * channelCount * sizeof(int16_t) * 4); 
                  if (builder.openStream(stream) != oboe::Result::OK) return false;
                  return (stream->start() == oboe::Result::OK);
              }

          void aaudio_close(void* h) {
              if (!h) return;
              AAudioStream* stream = (AAudioStream*)h;
              AAudioStream_requestStop(stream);
              aaudio_stream_state_t state = AAudioStream_getState(stream);
              // Don't close until the stream has actually finished stopping — closing while it's
              // still tearing down can double-destroy an internal mutex (FORTIFY abort).
              AAudioStream_waitForStateChange(stream, state, &state, 500'000'000LL);
              AAudioStream_close(stream);
          }

              oboe::DataCallbackResult onAudioReady(oboe::AudioStream *oboeStream, void *audioData, int32_t numFrames) override {
                  if (isClosing.load()) return oboe::DataCallbackResult::Stop;
                  std::lock_guard<std::mutex> guard(lock);
                  uint8_t* outBytes = static_cast<uint8_t*>(audioData);
                  int32_t bytesRequested = numFrames * 4;
                  for (int32_t i = 0; i < bytesRequested; ++i) {
                      if (ringReadPos == ringWritePos) {
                          outBytes[i] = 0; 
                      } else {
                          outBytes[i] = ringBuffer[ringReadPos];
                          ringReadPos = (ringReadPos + 1) % ringBuffer.size();
                      }
                  }
                  return oboe::DataCallbackResult::Continue;
              }

              void close() {
                  isClosing.store(true);
                  if (stream) { stream->stop(); stream->close(); stream.reset(); }
              }
          };

          extern "C" {
              void* aaudio_open(int32_t sampleRate, int32_t channelCount) {
                  AudioPlayerEngine* engine = new AudioPlayerEngine();
                  if (engine->open(sampleRate, channelCount)) return engine;
                  delete engine;
                  return nullptr;
              }
              void aaudio_close(void* h) {
                  if (!h) return;
                  AudioPlayerEngine* engine = static_cast<AudioPlayerEngine*>(h);
                  engine->close();
                  delete engine;
              }
              int32_t aaudio_write(void* h, const void* data, int32_t frames, int64_t timeoutNs) {
                  if (!h) return -1;
                  return static_cast<AudioPlayerEngine*>(h)->writeData((const uint8_t*)data, frames, timeoutNs);
              }
              int64_t aaudio_frames_written(void* h) {
                  return h ? static_cast<AudioPlayerEngine*>(h)->totalFramesWritten : -1;
              }
              int32_t aaudio_pause(void* h) {
                  if (h && static_cast<AudioPlayerEngine*>(h)->stream) {
                      static_cast<AudioPlayerEngine*>(h)->stream->requestPause();
                  }
                  return 0;
              }
              int32_t aaudio_resume(void* h) {
                  if (h && static_cast<AudioPlayerEngine*>(h)->stream) {
                      static_cast<AudioPlayerEngine*>(h)->stream->requestStart();
                  }
                  return 0;
              }
              int32_t aaudio_flush(void* h) {
                  if (h && static_cast<AudioPlayerEngine*>(h)->stream) {
                      static_cast<AudioPlayerEngine*>(h)->stream->requestFlush();
                  }
                  return 0;
              }
              int32_t aaudio_buffer_size(void* h) {
                  if (!h) return -1;
                  auto stream = static_cast<AudioPlayerEngine*>(h)->stream;
                  return stream ? stream->getBufferSizeInFrames() : -1;
              }
              int32_t aaudio_get_timestamp(void* h, int64_t* outPos, int64_t* outNs) {
                  if (!h) return -1;
                  auto stream = static_cast<AudioPlayerEngine*>(h)->stream;
                  if (stream) {
                      auto result = stream->getTimestamp(CLOCK_MONOTONIC);
                      if (result == oboe::Result::OK) {
                          *outPos = result.value().position;
                          *outNs = result.value().timestamp;
                          return 0;
                      }
                  }
                  return -1;
              }
          }
          EOF

          int32_t aaudio_pause(void* h)  { return h ? AAudioStream_requestPause((AAudioStream*)h)  : -1; }
          int32_t aaudio_resume(void* h) { return h ? AAudioStream_requestStart((AAudioStream*)h) : -1; }
          int32_t aaudio_flush(void* h)  { return h ? AAudioStream_requestFlush((AAudioStream*)h)  : -1; }
          int32_t aaudio_buffer_size(void* h) { return h ? AAudioStream_getBufferSizeInFrames((AAudioStream*)h) : -1; }

          } // extern "C"
          EOF

          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/21.4.7075529"
          cmake -B cmake-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -GNinja
          cmake --build cmake-build --config Release

          cd ../../
          mkdir -p out
          cp build/aaudio/cmake-build/libaaudio_sink.so out/libaaudio_sink.so
          TOOLCHAIN="$ANDROID_HOME/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64"
          "$TOOLCHAIN/bin/llvm-strip" out/libaaudio_sink.so

      - name: Install binaries into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp out/libffmpeg.so        app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          cp out/libaaudio_sink.so   app/src/main/jniLibs/arm64-v8a/libaaudio_sink.so
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64" \
            -o app/src/main/jniLibs/arm64-v8a/libytdlp.so
          echo "=== jniLibs contents ===" && find app/src/main/jniLibs/ -type f

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK (no signing secrets needed)
        run: ./gradlew assembleDebug

      - name: Assemble + sign release APK (only if secrets are set)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-plugin-apk
          path: app/build/outputs/apk/debug/*.apk
